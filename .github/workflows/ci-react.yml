name: CI React

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-react.yml'
      - 'projects/ui-grid-react/**'
      - 'projects/ui-grid-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run the React test suite
        run: npm run test:react
